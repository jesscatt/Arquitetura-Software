# Sobe o InfoHub completo (banco + app) com: docker compose up -d --build
# Acesse em http://localhost:3000  (login: admin@infohub.com / demo1234)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: infohub
      POSTGRES_USER: infohub
      POSTGRES_PASSWORD: infohub123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infohub -d infohub"]
      interval: 5s
      retries: 10

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: infohub
      DB_USER: infohub
      DB_PASSWORD: infohub123
      AUTH_SECRET: ${AUTH_SECRET:-troque-isto-por-um-texto-aleatorio-com-32-ou-mais-caracteres}
      APP_URL: ${APP_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
