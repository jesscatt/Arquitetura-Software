services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    container_name: infohub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infohub}
      POSTGRES_USER: ${POSTGRES_USER:-infohub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - infohub_pgdata:/var/lib/postgresql/data
      - ./database:/workspace/database:ro
      - ./database/scripts/initialize.sh:/docker-entrypoint-initdb.d/001_initialize.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

volumes:
  infohub_pgdata:
    name: infohub_pgdata
